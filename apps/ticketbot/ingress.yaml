apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketbot-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: ticketbot.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ticketbot-service
            port:
              number: 8000
