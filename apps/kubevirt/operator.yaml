apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubevirt/kubevirt/releases/download/v1.2.0
    targetRevision: HEAD
    chart: kubevirt-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kubevirt
